<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIANG-IN CHURCH OF CHRIST</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Segoe UI',sans-serif;
            background:linear-gradient(135deg,#0f0b08 0%,#1d140f 50%,#2b1f17 100%);
            color:#fff;
            min-height:100vh;
            overflow:hidden;
            position:relative;
        }
        .stars,.glow-orbs{
            position:fixed;
            inset:0;
            pointer-events:none;
        }
        .star{
            position:absolute;
            width:2px;
            height:2px;
            background:white;
            border-radius:50%;
            animation:twinkle 3s infinite;
        }
        @keyframes twinkle{
            0%,100%{opacity:.3}
            50%{opacity:1}
        }
        .glow-orb{
            position:absolute;
            border-radius:50%;
            background:radial-gradient(circle,rgba(212,175,55,.12) 0%,transparent 70%);
            filter:blur(40px);
            animation:float 6s ease-in-out infinite;
        }
        @keyframes float{
            0%,100%{transform:translateY(0)}
            50%{transform:translateY(-30px)}
        }
        .logo{
            position:fixed;
            top:30px;
            left:50px;
            z-index:10;
            display:flex;
            align-items:center;
            gap:10px;
            letter-spacing:2px;
        }
        .logo-circle{
            width:40px;
            height:40px;
            border:2px solid #d4af37;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        nav{
            position:fixed;
            top:30px;
            right:50px;
            display:flex;
            gap:30px;
            z-index:10;
        }
        nav a{
            color:#fff;
            text-decoration:none;
        }
        .container{
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:40px;
            position:relative;
            z-index:5;
        }
        .content{
            text-align:center;
            max-width:900px;
            background:rgba(0,0,0,.25);
            padding:60px;
            border-radius:30px;
            backdrop-filter:blur(10px);
        }
        h1{
            font-size:90px;
            font-weight:300;
            letter-spacing:8px;
            background:linear-gradient(135deg,#fff,#d4af37);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            margin-bottom:20px;
        }
        .subtitle{
            color:#ccc;
            line-height:1.8;
            margin-bottom:40px;
        }
        .login-button{
            padding:18px 50px;
            border-radius:50px;
            border:2px solid #d4af37;
            background:transparent;
            color:#d4af37;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }
        .login-button:hover{
            background:#d4af37;
            color:#111;
            transform:scale(1.05);
        }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="glow-orbs">
    <div class="glow-orb" style="width:300px;height:300px;top:10%;left:10%"></div>
    <div class="glow-orb" style="width:250px;height:250px;bottom:10%;right:10%"></div>
</div>

<div class="logo">
    <div class="logo-circle">✝</div>
    <span>WIANG-IN CHURCH</span>
</div>

<nav>
    <a href="#">HOME</a>
    <a href="#">ABOUT</a>
    <a href="#">CONTACT</a>
</nav>

<div class="container">
    <div class="content">
        <h1>JESUS</h1>
        <p class="subtitle">
            ยินดีต้อนรับสู่คริสตจักรเวียงอินทร์<br>
            สถานที่แห่งความรัก ความเชื่อ และการทรงสถิตของพระเจ้า
        </p>
        <button class="login-button">เข้าสู่ระบบ</button>
    </div>
</div>

<script>
const stars=document.getElementById('stars');
for(let i=0;i<100;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.animationDelay=Math.random()*3+'s';
    stars.appendChild(s);
}
</script>

</body>
</html>
