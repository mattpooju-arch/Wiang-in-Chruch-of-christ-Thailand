<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree of Life Church of Christ - Thailand</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #2d0052 50%, #1a0033 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Stars background effect */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Glow effect */
        .glow-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 100, 200, 0.3) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
            filter: blur(40px);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-30px) translateX(20px); }
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 100;
            display: flex;
            gap: 40px;
            padding: 30px 50px;
            font-size: 14px;
            letter-spacing: 2px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        nav a:hover {
            color: #ff66cc;
        }

        nav a.active {
            color: #ff66cc;
            border-bottom: 2px solid #ff66cc;
        }

        /* Logo */
        .logo {
            position: fixed;
            top: 30px;
            left: 50px;
            z-index: 100;
            font-size: 14px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-circle {
            width: 40px;
            height: 40px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 50px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
            width: 100%;
            max-width: 1400px;
        }

        .left-section h1 {
            font-size: 80px;
            font-weight: 300;
            letter-spacing: 8px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff 0%, #ff66cc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .left-section .subtitle {
            font-size: 16px;
            letter-spacing: 3px;
            margin-bottom: 40px;
            color: #ccc;
        }

        .divider {
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin-bottom: 30px;
        }

        .left-section p {
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 20px;
            color: #aaa;
        }

        .verse {
            font-size: 13px;
            color: #999;
            margin-bottom: 40px;
        }

        /* Login Button */
        .btn-login {
            display: inline-block;
            padding: 15px 40px;
            border: 2px solid #d4af37;
            background: transparent;
            color: #d4af37;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
        }

        .btn-login:hover {
            background: #d4af37;
            color: #1a0033;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            transform: scale(1.05);
        }

        /* Center button */
        .center-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
        }

        .login-button {
            padding: 20px 60px;
            font-size: 18px;
            letter-spacing: 3px;
            border: 3px solid #ff66cc;
            background: rgba(255, 102, 204, 0.1);
            color: #ff66cc;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border-radius: 50px;
        }

        .login-button:hover {
            background: #ff66cc;
            color: #1a0033;
            box-shadow: 0 0 50px rgba(255, 102, 204, 0.8);
            transform: scale(1.1);
        }

        /* Right section - Image placeholder */
        .right-section {
            position: relative;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tree-image {
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(212, 175, 55, 0.2) 0%, transparent 70%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 120px;
            opacity: 0.8;
        }

        /* Scroll down */
        .scroll-down {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: bounce 2s infinite;
        }

        .scroll-icon {
            width: 24px;
            height: 40px;
            border: 2px solid #d4af37;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            padding-top: 8px;
        }

        .scroll-icon::after {
            content: '';
            width: 4px;
            height: 8px;
            background: #d4af37;
            border-radius: 2px;
            animation: scroll 1.5s infinite;
        }

        @keyframes scroll {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(10px); opacity: 0; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .left-section h1 {
                font-size: 48px;
            }

            nav {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
                right: 20px;
            }

            .logo {
                left: 20px;
                top: 20px;
            }

            .login-button {
                padding: 15px 40px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Stars -->
    <div class="stars" id="stars"></div>
    
    <!-- Glow orbs -->
    <div class="glow-orbs">
        <div class="glow-orb" style="width: 300px; height: 300px; top: 10%; left: 10%; animation-delay: 0s;"></div>
        <div class="glow-orb" style="width: 250px; height: 250px; top: 50%; right: 15%; animation-delay: 2s;"></div>
        <div class="glow-orb" style="width: 200px; height: 200px; bottom: 10%; left: 30%; animation-delay: 4s;"></div>
    </div>

    <!-- Logo -->
    <div class="logo">
        <div class="logo-circle">🌳</div>
        <span>TREE OF LIFE</span>
    </div>

    <!-- Navigation -->
    <nav>
        <a href="#home" class="active">HOME</a>
        <a href="#about">ABOUT</a>
        <a href="#ministry">MINISTRY</a>
        <a href="#contact">CONTACT</a>
    </nav>

    <!-- Main container -->
    <div class="container">
        <!-- Center Login Button -->
        <button class="login-button" onclick="alert('เข้าสู่ระบบ - ยังไม่พร้อมใช้งาน')">เข้าสู่ระบบ</button>

        <!-- Content -->
        <div class="content">
            <div class="left-section">
                <h1>JESUS</h1>
                <p class="subtitle">THE LIGHT OF THE WORLD</p>
                <div class="divider"></div>
                <p>เราเป็นที่กำลังอยู่ของแต่ และพระเมียตของเราการเป็นปฏิบัติ</p>
                <div class="verse">ยอห์น 15:1</div>
                <button class="btn-login">DISCOVER MORE</button>
            </div>
            
            <div class="right-section">
                <div class="tree-image">
                    🌳
                </div>
            </div>
        </div>
    </div>

    <!-- Scroll Down -->
    <div class="scroll-down">
        <span style="font-size: 12px; letter-spacing: 2px;">SCROLL DOWN</span>
        <div class="scroll-icon"></div>
    </div>

    <script>
        // Generate random stars
        function generateStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        generateStars();

        // Smooth scroll
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    </script>
</body>
</html>
